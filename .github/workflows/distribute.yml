name: Distribute GrimGrind

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown to testers
        required: false
        default: New GrimGrind build
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.6"

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      ios_enabled: ${{ steps.check_secrets.outputs.ios_enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Check optional platform secrets
        id: check_secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ios_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios_enabled=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore Android signing key (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; falling back to debug signing config."
          fi
      - name: Build APK
        run: |
          flutter build apk --release --build-number "${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/grimgrind.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: grimgrind-android
          path: build/app/outputs/flutter-apk/grimgrind.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            TITLE="GrimGrind ${TAG_NAME}"
          else
            TAG_NAME="build-${GITHUB_RUN_NUMBER}"
            SHORT_SHA="${GITHUB_SHA::7}"
            TITLE="GrimGrind build #${GITHUB_RUN_NUMBER} (${SHORT_SHA})"
          fi
          NOTES="${RELEASE_NOTES:-Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" build/app/outputs/flutter-apk/grimgrind.apk --clobber
          else
            gh release create "$TAG_NAME" build/app/outputs/flutter-apk/grimgrind.apk \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
      - name: Check Firebase Android secrets
        id: firebase_android
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_ANDROID_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Distribute Android to Firebase testers
        if: steps.firebase_android.outputs.enabled == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: household
          file: build/app/outputs/flutter-apk/grimgrind.apk
          releaseNotes: ${{ inputs.release_notes || github.ref_name }}

  ios:
    needs: verify
    if: needs.verify.outputs.ios_enabled == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore Firebase iOS config (if configured)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST_BASE64 not set; building without GoogleService-Info.plist."
          fi
      - name: Install Apple certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/grimgrind.mobileprovision"
      - name: Create export options
        run: |
          sed -e "s/APPLE_TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/g" \
              -e "s/PROFILE_NAME_PLACEHOLDER/$IOS_PROFILE_NAME/g" \
              ios/ExportOptions/AdHoc.plist.template > ios/ExportOptions/AdHoc.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      - name: Build signed IPA
        run: flutter build ipa --release --build-number "${GITHUB_RUN_NUMBER}" --export-options-plist ios/ExportOptions/AdHoc.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      - name: Normalize IPA filename
        run: |
          ipa_files=(build/ios/ipa/*.ipa)
          mv "${ipa_files[0]}" build/ios/ipa/grimgrind.ipa
      - name: Check Firebase iOS secrets
        id: firebase_ios
        env:
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_IOS_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Distribute iOS to Firebase testers
        if: steps.firebase_ios.outputs.enabled == 'true'
        env:
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RELEASE_NOTES: ${{ inputs.release_notes || github.ref_name }}
        run: |
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SA_FILE"
          GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE" npx --yes firebase-tools appdistribution:distribute \
            build/ios/ipa/grimgrind.ipa \
            --app "$FIREBASE_IOS_APP_ID" \
            --groups household \
            --release-notes "$RELEASE_NOTES"
          rm -f "$SA_FILE"
      - name: Update Firestore distribution metadata (iOS)
        if: steps.firebase_ios.outputs.enabled == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DIST_PLATFORM: ios
          DIST_BUILD_NUMBER: ${{ github.run_number }}
          DIST_URL: https://appdistribution.firebase.dev/i/152f586ed88ca49c
          DIST_RELEASE_NOTES: ${{ inputs.release_notes || github.ref_name }}
        run: node tool/update_distribution_doc.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: grimgrind-ios
          path: build/ios/ipa/*.ipa
